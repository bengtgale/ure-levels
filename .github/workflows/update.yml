name: Update river levels

on:
  schedule:
    - cron: "*/15 * * * *"     # every 15 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:            # lets you run it by hand from the Actions tab
    inputs:
      backfill_from:
        description: "Backfill start date (YYYY-MM-DD) - only used for gauges with no data yet"
        required: false

permissions:
  contents: write

concurrency:
  group: update-levels
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest readings and save them
        env:
          BACKFILL_FROM: ${{ github.event.inputs.backfill_from }}
        run: |
          if [ -z "$BACKFILL_FROM" ]; then unset BACKFILL_FROM; fi
          git config user.name "river-bot"
          git config user.email "river-bot@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main          # always start from the latest saved state
            python -u fetch_levels.py || exit 1
            git add data
            if git diff --cached --quiet; then echo "No new readings"; exit 0; fi
            git commit -m "Update river levels"
            if git push origin HEAD:main; then exit 0; fi
            echo "Push rejected (another run saved first) - starting again, attempt $attempt"
            sleep $((attempt * 5))
          done
          exit 1
